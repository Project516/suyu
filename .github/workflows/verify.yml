name: 'suyu verify'

# This workflow is the format gate: it fails if the tree is not
# clang-format clean. Builds are covered by cmake-multi-platform.yml and
# release.yml instead.
#
# The old container build jobs were removed because the only images still
# available (suyuemu/cibuild, frozen in 2024) ship CMake < 3.31 while
# CMakeModules/CPMUtil.cmake now requires 3.31, so they cannot configure
# this tree. The format image is unaffected.

on:
  pull_request:
    branches: [ master, dev, metal-dev, fix/dynarmic-vcpkg-msvc-ci ]
    paths:
      - "src/**"
      - "CMakeModules/**"
      - "dist/**"
      - "externals/**"
      - "CMakeLists.txt"
      - "conanfile.txt"
      - ".github/workflows/verify.yml"
      - ".ci/**"
  push:
    branches: [ master, dev, metal-dev ]
    paths:
      - "src/**"
      - "CMakeModules/**"
      - "dist/**"
      - "externals/**"
      - "CMakeLists.txt"
      - "conanfile.txt"
      - ".github/workflows/verify.yml"
      - ".ci/**"

jobs:
  format:
    name: 'Verify Format'
    runs-on: ubuntu-latest
    container:
      # fijxu/build-environments was deleted from Docker Hub; suyuemu/cibuild
      # is the maintained successor (see .gitlab-ci.yml for the same mapping).
      image: suyuemu/cibuild:clangformat
      options: --user 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$(pwd)"
      - name: 'Verify Formatting'
        run: bash -ex ./.ci/scripts/format/script.sh
